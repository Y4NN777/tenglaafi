name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: y4nn777/tenglaafi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push (latest + sha)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Also push semver tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.0.3
        env:
          SSH_STRICT_HOSTKEY_CHECKING: no
          SSH_CONNECT_TIMEOUT: 10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          timeout: 30s
          script: |
            set -e
            cd /opt/tenglaafi

            mkdir -p chroma_db

            if ! grep -q "HF_TOKEN=" .env && [ -n "${{ secrets.HF_TOKEN }}" ]; then
              echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
            fi

            docker compose pull
            docker compose up -d --remove-orphans

            echo "Waiting for API..."
            for i in {1..100}; do
              if curl -fsS http://127.0.0.1:8000/health; then
                echo "API healthy"
                exit 0
              fi
              sleep 3
            done

            echo "Healthcheck failed"
            docker logs tenglaafi_rag_chatbot --tail 50
            exit 1
